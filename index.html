<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro 1 Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']],
         macros: { R: '\\mathbb{R}', pr: '\\succcurlyeq', Lz: '\\mathcal{L}(Z)' } },
  svg: { fontCache: 'global' }, startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" defer></script>
<style>
:root {
  --bg: #f4f3f0; --card: #ffffff; --ink: #1d1f21; --muted: #6b6e70; --line: #d9d7d2;
  --anth: #34383c; --anth-2: #4a4f54; --anth-soft: #e6e5e1;
  --ok: #2f6b45; --ok-bg: #e7f0ea; --bad: #8f2f2a; --bad-bg: #f5e6e4;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Archivo, system-ui, sans-serif; }
header { background: var(--anth); color: #f4f3f0; border-bottom: 4px solid #1d1f21; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
header .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 18px; padding-bottom: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-weight: 900; font-size: 30px; letter-spacing: -0.5px; text-transform: uppercase; }
h1 span { opacity: .55; font-weight: 600; }
.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; }
.stats { display: flex; gap: 18px; }
.stats b { font-size: 18px; display: block; font-family: 'JetBrains Mono', monospace; }
.panel { background: var(--card); border: 2px solid var(--anth); margin: 20px 0; padding: 16px; }
.panel h2 { margin: 0 0 10px; font-size: 13px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 2px solid var(--anth); background: #fff; color: var(--anth); padding: 5px 10px; font: 600 13px Archivo, sans-serif; cursor: pointer; }
.chip.on { background: var(--anth); color: #fff; }
.chip small { opacity: .6; font-weight: 500; margin-left: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.act { background: var(--anth); color: #fff; border: 2px solid var(--anth); padding: 10px 18px; font: 800 14px Archivo, sans-serif; text-transform: uppercase; letter-spacing: .6px; cursor: pointer; }
button.act.ghost { background: #fff; color: var(--anth); }
button.act:hover { background: #1d1f21; color: #fff; }
button.act:disabled { opacity: .35; cursor: default; }
.card { background: var(--card); border: 2px solid var(--anth); box-shadow: 6px 6px 0 var(--anth-soft); margin: 20px 0 40px; }
.card .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--anth-soft); border-bottom: 2px solid var(--anth); padding: 8px 16px; }
.tag { color: var(--anth-2); }
.q { padding: 20px 16px 6px; font-size: 18px; font-weight: 600; overflow-x: auto; }
.opts { padding: 8px 16px 16px; display: grid; gap: 8px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--line); padding: 12px; font: 500 16px/1.45 Archivo, sans-serif; color: var(--ink); cursor: pointer; overflow-x: auto; }
.opt:hover:not(:disabled) { border-color: var(--anth); }
.opt .k { flex: none; width: 26px; height: 26px; display: grid; place-items: center; background: var(--anth); color: #fff; font: 700 12px 'JetBrains Mono', monospace; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .k { background: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); }
.exp { margin: 0 16px 16px; border-left: 6px solid var(--anth); background: #fafaf8; padding: 12px 14px; overflow-x: auto; }
.exp .verdict { font-weight: 900; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.exp .verdict.ok { color: var(--ok); } .exp .verdict.bad { color: var(--bad); }
.nav { display: flex; justify-content: space-between; gap: 8px; padding: 0 16px 16px; flex-wrap: wrap; }
.bar { height: 6px; background: var(--anth-soft); } .bar i { display: block; height: 100%; background: var(--anth); width: 0; transition: width .2s; }
.done { padding: 28px 16px; text-align: center; }
.done .big { font: 900 56px Archivo, sans-serif; }
.hint { color: var(--muted); font-size: 13px; }
@media (max-width: 600px) { h1 { font-size: 22px; } .q { font-size: 16px; } .opt { font-size: 15px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Micro 1 <span>Drill</span></h1>
  <div class="stats mono">
    <div><b id="sBank">0</b>bank</div>
    <div><b id="sSeen">0</b>answered</div>
    <div><b id="sAcc">–</b>accuracy</div>
  </div>
</div></header>

<main class="wrap">
  <section class="panel">
    <h2>Topics</h2>
    <div class="chips" id="topics"></div>
    <h2>Type</h2>
    <div class="chips" id="kinds"></div>
    <div class="row">
      <button class="act" id="start">Start</button>
      <button class="act ghost" id="wrongOnly">Redo my mistakes <span id="nWrong"></span></button>
      <button class="act ghost" id="unseen">Unseen only</button>
      <label class="row hint"><input type="checkbox" id="shuffle" checked> shuffle</label>
      <button class="act ghost" id="reset" style="margin-left:auto">Reset progress</button>
    </div>
    <p class="hint">Keys: <b>1–5</b> or <b>A–E</b> answer · <b>Enter</b>/<b>→</b> next · <b>←</b> back. Pick no topic = all topics.</p>
  </section>
  <section id="quiz"></section>
</main>

<script>
const $ = s => document.querySelector(s);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('m1drill') || '{}'); } catch { return {}; } },
  set(v) { try { localStorage.setItem('m1drill', JSON.stringify(v)); } catch {} }
};
let BANK = [], prog = store.get(), sel = { topics: new Set(), kinds: new Set() }, run = null;
const KIND = { definition: 'Definition', proposition: 'Proposition', proof: 'Proof', exercise: 'Exercise', truefalse: 'True / False', concept: 'Concept' };

const typeset = el => window.MathJax?.typesetPromise ? MathJax.typesetPromise([el]).catch(() => {}) : null;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/&lt;br\s*\/?>/g, '<br>');

function stats() {
  const v = Object.values(prog), ok = v.filter(x => x.last).length;
  $('#sBank').textContent = BANK.length;
  $('#sSeen').textContent = v.length;
  $('#sAcc').textContent = v.length ? Math.round(100 * ok / v.length) + '%' : '–';
  const w = BANK.filter(q => prog[q.id] && !prog[q.id].last).length;
  $('#nWrong').textContent = w ? `(${w})` : '';
}

function chips(el, values, set, label) {
  el.innerHTML = '';
  for (const [v, n] of values) {
    const b = document.createElement('button');
    b.className = 'chip' + (set.has(v) ? ' on' : '');
    b.innerHTML = `${label(v)}<small>${n}</small>`;
    b.onclick = () => { set.has(v) ? set.delete(v) : set.add(v); b.classList.toggle('on'); };
    el.appendChild(b);
  }
}

function count(key) {
  const m = new Map();
  BANK.forEach(q => m.set(q[key], (m.get(q[key]) || 0) + 1));
  return [...m];
}

function pool(filter) {
  let p = BANK.filter(q => (!sel.topics.size || sel.topics.has(q.topic)) && (!sel.kinds.size || sel.kinds.has(q.kind)));
  if (filter) p = p.filter(filter);
  if ($('#shuffle').checked) for (let i = p.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  return p;
}

function begin(filter) {
  const qs = pool(filter);
  if (!qs.length) { $('#quiz').innerHTML = '<div class="card"><div class="done">Nothing matches this selection.</div></div>'; return; }
  run = { qs, i: 0, picks: {}, score: 0 };
  render();
  $('#quiz').scrollIntoView({ behavior: 'smooth' });
}

function render() {
  const { qs, i } = run;
  if (i >= qs.length) return finish();
  const q = qs[i], picked = run.picks[i];
  const answered = picked !== undefined;
  const L = 'ABCDE';
  $('#quiz').innerHTML = `
  <div class="card">
    <div class="bar"><i style="width:${100 * i / qs.length}%"></i></div>
    <div class="top mono"><span class="tag">${esc(q.topic)} · ${KIND[q.kind] || q.kind}</span><span>${i + 1} / ${qs.length} · score ${run.score}</span></div>
    <div class="q">${esc(q.q)}</div>
    <div class="opts">${q.options.map((o, k) => {
      let c = '';
      if (answered) c = k === q.answer ? 'right' : (k === picked ? 'wrong' : '');
      return `<button class="opt ${c}" data-k="${k}" ${answered ? 'disabled' : ''}><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`;
    }).join('')}</div>
    ${answered ? `<div class="exp"><div class="verdict ${picked === q.answer ? 'ok' : 'bad'}">${picked === q.answer ? 'Correct' : 'Wrong — answer ' + L[q.answer]}</div>${esc(q.explain)}</div>` : ''}
    <div class="nav">
      <button class="act ghost" id="prev" ${i ? '' : 'disabled'}>← Back</button>
      <button class="act ghost" id="quit">End session</button>
      <button class="act" id="next">${answered ? 'Next →' : 'Skip →'}</button>
    </div>
  </div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
  $('#prev').onclick = () => { run.i--; render(); };
  $('#next').onclick = () => { run.i++; render(); };
  $('#quit').onclick = finish;
  typeset($('#quiz'));
}

function pick(k) {
  const q = run.qs[run.i];
  if (run.picks[run.i] !== undefined) return;
  run.picks[run.i] = k;
  const ok = k === q.answer;
  if (ok) run.score++;
  const p = prog[q.id] || { n: 0, ok: 0 };
  p.n++; if (ok) p.ok++; p.last = ok;
  prog[q.id] = p; store.set(prog); stats();
  render();
}

function finish() {
  const n = Object.keys(run.picks).length;
  $('#quiz').innerHTML = `<div class="card"><div class="done">
    <div class="mono">Session done</div>
    <div class="big">${run.score} / ${n}</div>
    <p class="hint">${n ? Math.round(100 * run.score / n) + '% correct' : 'No answers given'}</p>
    <div class="row" style="justify-content:center"><button class="act" id="again">New session</button>
    <button class="act ghost" id="redo">Redo mistakes</button></div></div></div>`;
  $('#again').onclick = () => begin();
  $('#redo').onclick = () => begin(q => prog[q.id] && !prog[q.id].last);
}

document.addEventListener('keydown', e => {
  if (!run || run.i >= run.qs.length || e.target.tagName === 'INPUT') return;
  const k = e.key.toUpperCase();
  let n = '12345'.indexOf(k); if (n < 0) n = 'ABCDE'.indexOf(k);
  if (n >= 0 && n < run.qs[run.i].options.length) pick(n);
  else if (e.key === 'Enter' || e.key === 'ArrowRight') { run.i++; render(); }
  else if (e.key === 'ArrowLeft' && run.i) { run.i--; render(); }
});

$('#start').onclick = () => begin();
$('#wrongOnly').onclick = () => begin(q => prog[q.id] && !prog[q.id].last);
$('#unseen').onclick = () => begin(q => !prog[q.id]);
$('#reset').onclick = () => { if (confirm('Wipe all saved progress?')) { prog = {}; store.set(prog); stats(); } };

fetch('questions.json').then(r => r.json()).then(d => {
  BANK = d;
  chips($('#topics'), count('topic'), sel.topics, v => esc(v));
  chips($('#kinds'), count('kind'), sel.kinds, v => KIND[v] || v);
  stats();
});
</script>
</body>
</html>
